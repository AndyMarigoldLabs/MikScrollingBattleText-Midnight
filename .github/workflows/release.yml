name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package addon
        run: |
          mkdir -p .package
          cp -r MikScrollingBattleText MSBTOptions .package/
          cd .package && zip -r "../MSBT-${GITHUB_REF_NAME}.zip" MikScrollingBattleText MSBTOptions

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "MSBT-${{ github.ref_name }}.zip"
          generate_release_notes: true
